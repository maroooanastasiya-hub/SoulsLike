<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Пепельный Легион: Душа Павшего</title>
    <style>
      :root {
        color-scheme: dark;
        --void: #050409;
        --soul: #9fe8ff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        background: var(--void);
        overflow: hidden;
        font-family: "Courier New", ui-monospace, monospace;
        user-select: none;
        -webkit-user-select: none;
      }
      body { cursor: default; }
      #stage {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 50% 38%, #161022 0%, #080611 52%, #040308 100%);
      }
      #stage::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 50% 120%, rgba(120, 90, 220, 0.09), transparent 60%),
          radial-gradient(ellipse at 50% -20%, rgba(120, 220, 255, 0.05), transparent 55%);
      }
      #game-canvas {
        display: block;
        width: min(100vw, 177.7778vh);
        height: min(56.25vw, 100vh);
        background: #06050c;
        box-shadow:
          0 0 0 1px rgba(159, 232, 255, 0.06),
          0 0 80px rgba(90, 70, 160, 0.18),
          0 30px 120px rgba(0, 0, 0, 0.65);
        cursor: none;
        touch-action: none;
      }
      #vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.42) 100%);
      }
      #scanlines {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.16;
        background: repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.055) 0px,
          rgba(255, 255, 255, 0.055) 1px,
          transparent 1px,
          transparent 3px
        );
        mix-blend-mode: soft-light;
      }
      #game-state { display: none; }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #050409;
        color: var(--soul);
        font-size: 12px;
        letter-spacing: 5px;
        z-index: 10;
        transition: opacity 0.5s ease;
      }
      #boot.hidden { opacity: 0; pointer-events: none; }
      #boot span { animation: breathe 1.8s ease-in-out infinite; }
      @keyframes breathe {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="game-canvas"></canvas>
    </div>
    <div id="vignette"></div>
    <div id="scanlines"></div>
    <div id="game-state" hidden></div>
    <div id="boot"><span>ПРОБУЖДЕНИЕ ДУШИ</span></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
